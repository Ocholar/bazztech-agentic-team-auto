name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/dashboard/package-lock.json

    - name: Install Dependencies
      run: |
        cd src/dashboard
        npm install

    - name: Prisma Generate
      run: |
        cd src/dashboard
        npx prisma generate

    - name: Run Unit Tests
      run: |
        cd src/dashboard
        npm test

    - name: Run Linting
      run: |
        cd src/dashboard
        npm run lint

    - name: Build Application
      run: |
        cd src/dashboard
        npm run build
      env:
        NEXT_PUBLIC_VERCEL_ENV: production
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
